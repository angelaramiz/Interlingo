services:
  - type: web
    name: interlingo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: AI_PROVIDER
        value: orcarouter
      - key: ORCA_BASE_URL
        value: https://api.orcarouter.ai/v1/chat/completions
      - key: ORCA_MODEL
        value: z-ai/glm-5.3-flash-free
      - key: ORCA_API_KEY
        sync: false
