<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo degrade profundo espacial / indigo moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="45%" stop-color="#111E3D"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Brillo de relieve de cristal superior -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente Globo / Burbuja Principal (Azul electrico a Cian) -->
    <linearGradient id="bubbleMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Gradiente Burbuja Secundaria (Violeta a Fucsia / AI) -->
    <linearGradient id="bubbleSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Gradiente Acentos Dorados / AI Star -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Gradiente Letra A de alta definicion -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Sombra squircle para volumen exterior -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Sombra interior de elementos -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#030712" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle (Esquinas redondeadas rx=105, exterior 100% transparente) -->
  <rect x="20" y="20" width="472" height="472" rx="105" ry="105" 
        fill="url(#bgGrad)" filter="url(#squircleShadow)" 
        stroke="#60A5FA" stroke-width="3.5" stroke-opacity="0.45"/>

  <!-- Brillo de curvatura y biselado superior estilo iOS / Fluent -->
  <path d="M 24,125 C 24,69 69,24 125,24 L 387,24 C 443,24 488,69 488,125 L 488,230 C 350,220 160,200 24,270 Z" 
        fill="url(#glossGrad)"/>

  <!-- Red Neural / Puntos de conectividad sutiles de fondo -->
  <g opacity="0.25">
    <circle cx="100" cy="110" r="3" fill="#93C5FD"/>
    <circle cx="410" cy="110" r="3" fill="#93C5FD"/>
    <circle cx="85" cy="390" r="3" fill="#93C5FD"/>
    <circle cx="420" cy="380" r="3" fill="#93C5FD"/>
    <line x1="100" y1="110" x2="160" y2="150" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="410" y1="110" x2="350" y2="150" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="85" y1="390" x2="140" y2="350" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="420" y1="380" x2="360" y2="350" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Aura / Halo orbital central de conexion linguistica -->
  <ellipse cx="256" cy="252" rx="165" ry="155" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 8"/>

  <!-- BURBUJA SECUNDARIA (Idiomas Globales / Inteligencia, Violeta vibrante) -->
  <!-- Situada arriba a la derecha y parcialmente detrás -->
  <g filter="url(#elementShadow)">
    <!-- Cuerpo de la burbuja derecha -->
    <path d="M 230,120 L 370,120 C 408,120 435,147 435,185 L 435,255 C 435,293 408,320 370,320 L 330,320 L 305,355 C 300,362 290,358 290,350 L 290,320 L 230,320 C 192,320 165,293 165,255 L 165,185 C 165,147 192,120 230,120 Z" 
          fill="url(#bubbleSec)" stroke="#A78BFA" stroke-width="2.5" stroke-opacity="0.6"/>
    
    <!-- Caracter "文" (Cultura / Lenguaje universal) estilizado y nítido -->
    <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
      <!-- Punto superior -->
      <line x1="335" y1="168" x2="335" y2="182"/>
      <!-- Trazo horizontal -->
      <line x1="295" y1="195" x2="375" y2="195"/>
      <!-- Trazo diagonal izquierda -->
      <path d="M 350,205 Q 320,245 285,278"/>
      <!-- Trazo diagonal derecha -->
      <path d="M 320,215 Q 345,248 385,278"/>
    </g>
  </g>

  <!-- BURBUJA PRINCIPAL (Habla / Aprendizaje activo, Azul Eléctrico) -->
  <!-- Situada abajo a la izquierda y en primer plano -->
  <g filter="url(#elementShadow)">
    <!-- Cuerpo de la burbuja izquierda -->
    <path d="M 140,165 L 285,165 C 323,165 350,192 350,230 L 350,305 C 350,343 323,370 285,370 L 230,370 L 195,408 C 188,416 176,411 176,402 L 176,370 L 140,370 C 102,370 75,343 75,305 L 75,230 C 75,192 102,165 140,165 Z" 
          fill="url(#bubbleMain)" stroke="#60A5FA" stroke-width="3" stroke-opacity="0.8"/>

    <!-- Brillo interno de la burbuja principal -->
    <path d="M 100,200 C 100,180 120,170 145,170 L 280,170 C 260,200 130,220 95,280 C 95,250 95,210 100,200 Z" 
          fill="#93C5FD" fill-opacity="0.25"/>

    <!-- Letra "A" estilizada y audaz (Geométrica / Pro) -->
    <!-- Pierna izquierda, vértice y pierna derecha -->
    <path d="M 170,325 L 212,210 C 215,202 225,202 228,210 L 270,325" 
          fill="none" stroke="url(#textGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Barra transversal de la "A" con acento de fluidez / onda sonora -->
    <path d="M 183,288 Q 220,296 257,288" 
          fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Flechas orbitales de intercambio bidireccional (Interlingo Bridge) -->
  <g stroke="#38BDF8" stroke-width="3.5" fill="none" stroke-linecap="round">
    <!-- Flecha hacia la derecha -->
    <path d="M 235,145 Q 260,135 285,145"/>
    <path d="M 280,137 L 287,146 L 277,152"/>
    <!-- Flecha hacia la izquierda -->
    <path d="M 280,385 Q 255,395 230,385"/>
    <path d="M 235,393 L 228,384 L 238,378"/>
  </g>

  <!-- DESTELLO DE INTELIGENCIA ARTIFICIAL (AI Star de 4 puntas) -->
  <!-- Situada en la esquina superior de la burbuja para denotar el motor IA -->
  <g transform="translate(395, 100)" filter="url(#elementShadow)">
    <circle cx="0" cy="0" r="18" fill="#FEF08A" fill-opacity="0.25"/>
    <!-- Estrella 4 puntas -->
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" 
          fill="url(#goldSpark)" stroke="#FEF08A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Micro-destello secundario -->
  <g transform="translate(100, 155)">
    <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" 
          fill="#38BDF8" opacity="0.85"/>
  </g>

  <!-- Micro-destello terciario -->
  <g transform="translate(345, 385)">
    <path d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z" 
          fill="#FDE047" opacity="0.8"/>
  </g>
</svg>